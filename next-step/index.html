}
function saveDone(id, set) {
  try { localStorage.setItem("hatzad:" + id, JSON.stringify([...set])); } catch (e) {}
}

// ---------- Render ----------
const app = document.getElementById("app");

function renderHome() {
  const tiles = Object.entries(CONDITIONS).map(([id, c]) => `
    <a class="tile${c.wide ? " wide" : ""}" href="#${id}">
      <span class="tile-name">${c.name}</span>
      <span class="tile-sub">${c.sub}</span>
      <span class="pill${c.ready ? "" : " muted"}">${c.ready ? "מדריך מלא" : "שלד כללי"}</span>
    </a>`).join("");
  app.innerHTML = `
    <div class="wrap-inner" style="display:flex;flex-direction:column;gap:24px">
      <div class="intro">
        <h1>מה האבחנה?</h1>
        <p class="lede">בוחרים, ומקבלים את מה שעושים, לפי הסדר. לכל צעד יש משפט מוכן להגיד בקופה. כסף וביטוחים מחכים בסוף.</p>
      </div>
      <nav class="tiles" aria-label="בחירת אבחנה">${tiles}</nav>
    </div>`;
}

function stepHTML(s, i, isDone, isOpen) {
  const todo = s.todo ? `<ul class="todo">${s.todo.map(t => `<li>${t}</li>`).join("")}</ul>` : "";
  const sched = s.schedule ? `<div class="sched-wrap"><table class="sched"><tbody>${
    s.schedule.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join("")
  }</tbody></table></div>` : "";
  const slot = s.slot ? `<div class="slot">כאן ייכנס: ${s.slot}</div>` : "";
  return `
    <li>
      <details class="step${isDone ? " done" : ""}" data-step="${s.id}"${isOpen ? " open" : ""}>
        <summary>
          <span class="num" aria-hidden="true">${isDone ? "✓" : i + 1}</span>
          <span class="step-title">${s.title}</span>
          <span class="chev" aria-hidden="true">▾</span>
        </summary>
        <div class="step-body">
          <p class="why">${s.why}</p>
          ${todo}${sched}${slot}
          <div class="note"><small>מה להגיד</small><p>"${s.say}"</p></div>
          <p class="where">איפה: <b>${s.where}</b></p>
          <label class="check"><input type="checkbox" id="done-${s.id}" data-step="${s.id}"${isDone ? " checked" : ""}> עשיתי את זה</label>
        </div>
      </details>
    </li>`;
}

function renderPath(id) {
  const c = CONDITIONS[id];
  const steps = c.ready ? c.steps : SKELETON_STEPS;
  const later = c.ready ? c.later : SKELETON_LATER;
  const done = loadDone(id);
  const firstOpen = steps.findIndex(s => !done.has(s.id));

  const laterItems = later.map(l => `
    <li><b>${l.title}</b><span>${l.text}</span>${l.slot ? `<div class="slot" style="margin-top:6px">כאן ייכנס: ${l.slot}</div>` : ""}</li>`).join("");

  const guide = c.guide
    ? `<li>מדריך מלא בכתב: <a href="${c.guide.href}" target="_blank" rel="noopener">${c.guide.label}</a></li>`
    : `<li>מדריך מלא בכתב: <a href="https://www.kolzchut.org.il" target="_blank" rel="noopener">כל זכות</a></li>`;

  app.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:22px">
      <a class="back" href="#">→ כל האבחנות</a>
      <div class="intro">
        <h1>${c.name}</h1>
        <div class="progress">
          <div class="bar"><i id="bar"></i></div>
          <span class="progress-text" id="progress-text"></span>
        </div>
      </div>
      ${c.ready ? "" : `<div class="banner">זה השלד הכללי. התוכן הספציפי ל${c.name} עוד לא נכתב, והמקומות שלו מסומנים במסגרת מקווקוות.</div>`}
      <ol class="steps">${steps.map((s, i) => stepHTML(s, i, done.has(s.id), i === firstOpen)).join("")}</ol>
      <details class="later">
        <summary>
          <h2>כסף, ביטוחים וזכויות</h2>
          <span class="pill muted">אחר כך</span>
          <span class="later-sub">לא דחוף. חוזרים לזה אחרי שהטיפול מסודר.</span>
        </summary>
        <ul class="later-list">${laterItems}</ul>
      </details>
      <section class="stuck" aria-labelledby="stuck-h">
        <h2 id="stuck-h">נתקעתם?</h2>
        <ul>
          <li>הקופה מסרבת למשהו שמגיע לכם: נציבות קבילות בריאות, דרך אתר משרד הבריאות</li>
          <li>שאלות על זכויות של אזרח ותיק: מוקד <bdi dir="ltr">*8840</bdi></li>
          ${guide}
        </ul>
      </section>
    </div>`;

  updateProgress(id, steps, done);

  app.querySelectorAll('input[type="checkbox"][data-step]').forEach(box => {
    box.addEventListener("change", () => {
      const stepId = box.dataset.step;
      const det = box.closest("details");
      if (box.checked) done.add(stepId); else done.delete(stepId);
      saveDone(id, done);
      det.classList.toggle("done", box.checked);
      const idx = steps.findIndex(s => s.id === stepId);
      det.querySelector(".num").textContent = box.checked ? "✓" : String(idx + 1);
      if (box.checked) {
        det.open = false;
        const next = steps.find(s => !done.has(s.id));
        if (next) app.querySelector(`details[data-step="${next.id}"]`).open = true;
      }
      updateProgress(id, steps, done);
    });
  });
}

function updateProgress(id, steps, done) {
  const count = steps.filter(s => done.has(s.id)).length;
  const bar = document.getElementById("bar");
  const text = document.getElementById("progress-text");
  if (bar) bar.style.width = Math.round((count / steps.length) * 100) + "%";
  if (text) text.textContent = count === steps.length
    ? `כל ${steps.length} הצעדים בוצעו`
    : `בוצעו ${count} מתוך ${steps.length} צעדים`;
}

function route() {
  const id = location.hash.slice(1);
  if (CONDITIONS[id]) renderPath(id); else renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
